<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Symbol -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Drop Container -->
    <path d="M 32 4 C 18 24 10 38 10 48 A 22 22 0 1 0 54 48 C 54 38 46 24 32 4 Z" fill="url(#dropGrad)" filter="url(#glow)" />
    <!-- Inner Milk Wave White -->
    <path d="M 12 48 Q 22 40 32 48 T 52 48 A 20 20 0 0 1 12 48 Z" fill="#ffffff" opacity="0.95" />
    <!-- IoT Sensor Waves -->
    <path d="M 32 20 Q 37 24 32 28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 32 14 Q 44 24 32 34" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <!-- Chip / Circuit dot -->
    <circle cx="32" cy="54" r="3.5" fill="#10b981" />
    <line x1="32" y1="54" x2="32" y2="60" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- Typography -->
  <g transform="translate(80, 20)">
    <text x="0" y="28" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#ffffff">
      DAIRY<tspan fill="#38bdf8">NOVA</tspan>
    </text>
    <text x="2" y="46" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3" fill="#94a3b8">
      SMART MILK PURITY &amp; PRICING
    </text>
  </g>
</svg>
